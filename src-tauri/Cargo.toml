[package]
name = "relic"
version = "0.1.0"
description = "Relic 桌面翻译"
edition = "2024"

[lib]
name = "relic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.2.1"
notify = "8.2.2"
whatlang = "0.18.0"
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "json", "native-tls", "http2", "charset", "system-proxy"] }
tokio = { version = "1.54.1", features = ["time", "sync"] }
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
toml_edit = "0.25.19"
tauri-plugin-autostart = "2.7.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
